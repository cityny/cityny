name: Deploy CV Personalizado

on:
  push:
    branches: [main]
    paths:
      - 'cv-portfolio/**'
      - '.github/scripts/cv-pdf.mjs'
      - '.github/workflows/deploy-cv.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # PDF del CV (español, inglés, ambos y APA) en cv-portfolio/pdf/, como los
      # botones de imprimir. Los descarga el bot de empleo desde GitHub Pages.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar PDF del CV
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory cv-portfolio &
          sleep 2
          node .github/scripts/cv-pdf.mjs http://localhost:8765/ cv-portfolio/pdf

      - name: Desplegar a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Esto toma lo que está DENTRO de la carpeta y lo pone en la RAÍZ de gh-pages
          publish_dir: ./cv-portfolio  
          publish_branch: gh-pages
          force_orphan: true
